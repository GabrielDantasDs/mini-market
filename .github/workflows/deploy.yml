name: Deploy Mini Market API

on:
  push:
    branches:
      - main  # roda o deploy quando houver push na branch main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Instalar Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Compilar binário para Linux
        run: |
          CGO_ENABLED=1 GOOS=linux GOARCH=amd64 go build -o app ./api/app

      - name: Enviar binário e arquivos para EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "./api/app"
          target: "/home/ubuntu/mini-market/api"

      - name: Reiniciar serviço na EC2
        uses: appleboy/ssh-action@v1.1.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            sudo systemctl restart mini-market
            sudo systemctl status mini-market --no-pager
